<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind Support Assistant</title>
<style>
  :root {
    --bg: #f4f5f2;
    --surface: #ffffff;
    --border: #e1e3dd;
    --text: #1c2321;
    --muted: #64706b;
    --accent: #1f5f4a;
    --accent-soft: #e6efe9;
    --warn: #9a5b00;
    --warn-soft: #fbf0dc;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 14px 24px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .logo {
    width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: #fff;
    display: grid; place-items: center; font-weight: 700; letter-spacing: -0.5px; font-size: 14px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .status { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .pill {
    font: 12px/1 var(--mono); padding: 6px 9px; border: 1px solid var(--border); border-radius: 999px;
    color: var(--muted); background: var(--bg); white-space: nowrap;
  }
  .pill b { color: var(--text); font-weight: 600; }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 0; }
  .chat { display: flex; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 28px 24px 12px; }
  .inner { max-width: 760px; margin: 0 auto; }
  .msg { display: flex; margin-bottom: 18px; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 82%; padding: 11px 15px; border-radius: 14px; }
  .user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .bot .bubble {
    background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px;
    box-shadow: 0 1px 2px rgba(20, 30, 25, .04);
  }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin: 0; }
  sup.cite { white-space: nowrap; }
  sup.cite a {
    font: 600 10.5px/1 var(--mono); color: var(--accent); background: var(--accent-soft);
    padding: 2px 5px; border-radius: 4px; text-decoration: none; margin-left: 2px;
  }
  .trace { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 9px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
  .tool {
    font: 12.5px/1.45 var(--mono); color: var(--text); display: flex; gap: 8px; align-items: baseline;
    padding: 3px 0;
  }
  .tool .name { color: var(--accent); font-weight: 600; }
  .tool .args { color: var(--muted); overflow-wrap: anywhere; }
  .tool .out { margin-left: auto; white-space: nowrap; color: var(--text); }
  .sources { margin-top: 10px; display: grid; gap: 6px; }
  .src {
    display: grid; grid-template-columns: auto 1fr; gap: 2px 9px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font-size: 13px;
  }
  .src .n { grid-row: span 2; font: 600 11px/1 var(--mono); color: var(--accent); background: var(--accent-soft); padding: 4px 6px; border-radius: 4px; align-self: start; }
  .src .t { font-weight: 600; }
  .src .s { color: var(--muted); font-size: 12.5px; }
  .src.flash { outline: 2px solid var(--accent); }
  .flag {
    display: inline-block; margin-top: 10px; font-size: 12.5px; color: var(--warn); background: var(--warn-soft);
    padding: 4px 9px; border-radius: 6px; font-weight: 600;
  }
  .typing { color: var(--muted); font-size: 13.5px; }
  .typing span { animation: blink 1.2s infinite; } .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 50% { opacity: .2; } }
  .empty { text-align: center; color: var(--muted); padding: 40px 0 10px; }
  .empty h2 { color: var(--text); font-size: 20px; margin: 0 0 6px; font-weight: 650; }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .suggest button {
    font: inherit; font-size: 13.5px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 7px 12px; border-radius: 8px; cursor: pointer;
  }
  .suggest button:hover { border-color: var(--accent); color: var(--accent); }
  form { padding: 14px 24px 20px; }
  .composer {
    max-width: 760px; margin: 0 auto; display: flex; gap: 8px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 6px;
  }
  .composer:focus-within { border-color: var(--accent); }
  .composer input { flex: 1; border: 0; outline: 0; font: inherit; padding: 8px 10px; background: transparent; color: var(--text); }
  .composer button {
    border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600; padding: 8px 16px;
    border-radius: 8px; cursor: pointer;
  }
  .composer button:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 760px; margin: 8px auto 0; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; }
  .hint a { color: var(--muted); }
  aside { border-left: 1px solid var(--border); background: var(--surface); padding: 20px; overflow-y: auto; }
  aside h3 { font-size: 13px; margin: 0 0 12px; display: flex; justify-content: space-between; }
  aside h3 span { color: var(--muted); font-weight: 500; }
  .ticket { border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; font-size: 13px; }
  .ticket .top { display: flex; justify-content: space-between; font: 12px/1.4 var(--mono); margin-bottom: 3px; }
  .ticket .top b { color: var(--accent); }
  .ticket .kind { color: var(--muted); }
  .ticket .kind.escalation { color: var(--warn); font-weight: 600; }
  .ticket .meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .none { color: var(--muted); font-size: 13px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { display: none; } .status .opt { display: none; } }
</style>
</head>
<body>
<header>
  <div class="logo">NW</div>
  <div>
    <h1>Northwind Outfitters</h1>
    <p>Support assistant · demo store, all data fictional</p>
  </div>
  <div class="status" id="status"></div>
</header>
<main>
  <section class="chat">
    <div id="log"><div class="inner" id="inner">
      <div class="empty" id="empty">
        <h2>How can we help?</h2>
        <div>Ask about shipping, returns, warranty or sizing, check an order, or open a ticket.</div>
        <div class="suggest" id="suggest"></div>
      </div>
    </div></div>
    <form id="form" autocomplete="off">
      <div class="composer">
        <input id="input" placeholder="Type your question, e.g. Where is my order NW-10482?" maxlength="4000">
        <button id="send" type="submit">Send</button>
      </div>
      <div class="hint"><span>Answers cite the help-center article they come from.</span><a href="#" id="reset">New conversation</a></div>
    </form>
  </section>
  <aside>
    <h3>Support tickets <span id="tcount"></span></h3>
    <div id="tickets"><div class="none">No tickets yet.</div></div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const SUGGESTIONS = [
  "How long does shipping to Canada take?",
  "Where is my order NW-10482?",
  "Can I return boots I wore outside?",
  "I'd like to talk to a human",
];
let sessionId = null;  // server-side memory is keyed by this id

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function render(text, sources, msgId) {
  const index = Object.fromEntries(sources.map((s, i) => [s.id, i + 1]));
  let html = esc(text)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\s*\[([a-z0-9-]+#[a-z0-9-]+)\]/g, (_, id) =>
      index[id] ? `<sup class="cite"><a href="#${msgId}-src-${index[id]}" data-target="${msgId}-src-${index[id]}">${index[id]}</a></sup>` : "");
  return html.split(/\n{2,}/).map((p) => `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
}

function scrollDown() { const log = $("log"); log.scrollTop = log.scrollHeight; }

function addUser(text) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg user";
  el.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  $("inner").appendChild(el);
  scrollDown();
}

function addTyping() {
  const el = document.createElement("div");
  el.className = "msg bot";
  el.innerHTML = `<div class="bubble typing">Checking<span>.</span><span>.</span><span>.</span></div>`;
  $("inner").appendChild(el);
  scrollDown();
  return el;
}

let counter = 0;
function botHTML(data) {
  const msgId = `m${++counter}`;
  let html = render(data.reply, data.sources, msgId);
  if (data.escalated) html += `<div class="flag">Handed over to a human agent</div>`;
  if (data.tool_calls.length) {
    html += `<div class="trace"><div class="label">Tools called</div>` + data.tool_calls.map((t) => {
      const short = (v) => { const j = JSON.stringify(v); return j.length > 48 ? j.slice(0, 45) + '..."' : j; };
      const args = Object.entries(t.arguments).map(([k, v]) => `${k}=${short(v)}`).join(", ");
      return `<div class="tool"><span class="name">${esc(t.name)}</span><span class="args">${esc(args)}</span><span class="out">&rarr; ${esc(t.summary)}</span></div>`;
    }).join("") + `</div>`;
  }
  if (data.sources.length) {
    html += `<div class="sources"><div class="label">Sources</div>` + data.sources.map((s, i) =>
      `<div class="src" id="${msgId}-src-${i + 1}"><span class="n">${i + 1}</span><span class="t">${esc(s.title)} &middot; ${esc(s.section)}</span><span class="s">${esc(s.snippet)}</span></div>`
    ).join("") + `</div>`;
  }
  return html;
}

async function send(text) {
  text = text.trim();
  if (!text) return;
  $("input").value = "";
  $("send").disabled = true;
  addUser(text);
  const typing = addTyping();
  try {
    const res = await fetch("/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    sessionId = data.session_id;
    typing.querySelector(".bubble").classList.remove("typing");
    typing.querySelector(".bubble").innerHTML = botHTML(data);
    loadTickets();
  } catch (err) {
    typing.querySelector(".bubble").classList.remove("typing");
    typing.querySelector(".bubble").innerHTML = `<p>Sorry, something went wrong (${esc(err.message)}). Please try again.</p>`;
  } finally {
    $("send").disabled = false;
    $("input").focus();
    scrollDown();
  }
}

async function loadTickets() {
  try {
    const tickets = await (await fetch("/tickets")).json();
    $("tcount").textContent = tickets.length ? tickets.length : "";
    $("tickets").innerHTML = tickets.length ? tickets.slice(0, 20).map((t) => `
      <div class="ticket">
        <div class="top"><b>${esc(t.ticket_id)}</b><span class="kind ${esc(t.kind)}">${esc(t.kind)} · ${esc(t.priority)}</span></div>
        <div>${esc(t.summary)}</div>
        <div class="meta">${esc(t.email)}${t.order_id ? " · " + esc(t.order_id) : ""}</div>
      </div>`).join("") : `<div class="none">No tickets yet.</div>`;
  } catch (_) {}
}

async function loadHealth() {
  try {
    const h = await (await fetch("/health")).json();
    $("status").innerHTML =
      `<span class="pill">LLM <b>${esc(h.provider)}</b> · ${esc(h.model)}</span>` +
      `<span class="pill opt">retrieval <b>${esc(h.retrieval)}</b></span>` +
      `<span class="pill opt"><b>${h.kb_documents}</b> docs · <b>${h.kb_chunks}</b> chunks</span>`;
  } catch (_) {}
}

$("suggest").innerHTML = SUGGESTIONS.map((s) => `<button type="button">${esc(s)}</button>`).join("");
$("suggest").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") send(e.target.textContent); });
$("form").addEventListener("submit", (e) => { e.preventDefault(); send($("input").value); });
$("inner").addEventListener("click", (e) => {
  const a = e.target.closest("sup.cite a");
  if (!a) return;
  e.preventDefault();
  const el = document.getElementById(a.dataset.target);
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200);
});
$("reset").addEventListener("click", async (e) => {
  e.preventDefault();
  if (sessionId) await fetch(`/chat/${encodeURIComponent(sessionId)}`, { method: "DELETE" });
  location.reload();
});
loadHealth(); loadTickets(); $("input").focus();
</script>
</body>
</html>
