[project]
name = "support-agent-rag"
version = "0.1.0"
description = "AI customer-support agent with RAG, tool calling and human escalation (FastAPI)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.0"]
openai = ["openai>=1.50"]
all = ["anthropic>=2.0", "openai>=1.50"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "playwright>=1.48",
]

[project.scripts]
support-agent = "support_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
